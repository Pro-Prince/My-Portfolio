name: Supabase Keep-Alive (All Projects)

on:
  schedule:
    - cron: '0 6 */3 * *'  # Every 3 days at 6:00 AM UTC
  workflow_dispatch:

jobs:
  ping-all-supabase-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Portfolio Admin Panel
        run: |
          curl -s -o /dev/null -w "Portfolio: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Ping PDF Craft
        run: |
          curl -s -o /dev/null -w "PDF Craft: %{http_code}\n" \
            "${{ secrets.PDFCRAFT_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.PDFCRAFT_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.PDFCRAFT_KEY }}"

      - name: Ping SoulSync Android
        run: |
          curl -s -o /dev/null -w "SoulSync Android: %{http_code}\n" \
            "${{ secrets.SOULSYNC_ANDROID_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SOULSYNC_ANDROID_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SOULSYNC_ANDROID_KEY }}"

      - name: Ping Lyra
        run: |
          curl -s -o /dev/null -w "Lyra: %{http_code}\n" \
            "${{ secrets.LYRA_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.LYRA_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.LYRA_KEY }}"

      - name: Ping Indoor Digital Twin
        run: |
          curl -s -o /dev/null -w "Digital Twin: %{http_code}\n" \
            "${{ secrets.DIGITAL_TWIN_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.DIGITAL_TWIN_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.DIGITAL_TWIN_KEY }}"
