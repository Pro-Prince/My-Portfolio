name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 */3 * *'  # Runs every 3 days at 6:00 AM UTC
  workflow_dispatch:        # Allows manual trigger from GitHub UI too

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (read-only, no data written)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/page_visits?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
